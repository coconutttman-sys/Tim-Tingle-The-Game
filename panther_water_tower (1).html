<script>
(()=>{

const NAME='TIM TINGLE';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const VW=960,VH=540,G=0.58,MAXFALL=14;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const hash=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
function rng(seed){let s=(seed>>>0)||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function inCone(ox,oy,ang,half,range,px,py){
  const dx=px-ox,dy=py-oy,d=Math.hypot(dx,dy);if(d>range||d<1)return false;
  let da=Math.atan2(dy,dx)-ang;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
  return Math.abs(da)<half;
}

/* ===================== DATA ===================== */
const REGIONS=['THE RED TRAIL FOREST','THE ABANDONED CAMPSITE','THE BROKEN RAVINE','THE FORGOTTEN GROUNDS','THE OLD WATER TOWER'];
const LEVELS=[
{name:'Awakening Under Red',radio:['D|Base Command to Tim Tingle. Signal is thin out here. The sky has been blood-red since the sirens went quiet.','P|I am awake. The pines are whispering and I can smell lamp oil. Guards are close.','D|Objective: follow the red trail east. Hold [C] in tall grass and let the flashlights pass over you.'],clues:["Torn page: 'The sirens stopped. The lights never did.'","Paw prints in the ash, all leading east."]},
{name:'Whisper in the Pines',radio:['D|Tim, you are clear of the first ridge. Two sentries ahead, patrolling the old logging path.','P|I can hear their boots. Slow, even steps. I can use that.','D|Objective: study their rhythm and slip past. High ground sits above their lights.'],clues:["Logbook: 'Sentries rotate every ten minutes. Never the same path twice.'","A cracked lantern, still warm."]},
{name:'Patrol Lines',radio:['D|Patrol lines are tightening. They know something moved through the trees.','P|Let them look. Shadow is the one thing this forest has plenty of.','D|Objective: cross three patrol lines. Sprinting in the light draws eyes. Move between the grass.'],clues:["Note: 'If you see the cat, do not tell the Captain.'","A guard's whistle, bent and abandoned."]},
{name:'The Watch Captain',radio:['D|Heads up. The Watch Captain holds the gate at the end of the trail. He sees everything... except what is above him.','P|Then I will go over him.','D|Objective: survive his beams. When he tires, drop from the scaffolds onto him. The gate will seal behind you.'],clues:["Scrap of orders: 'The Captain never looks up.'","Claw marks on the iron gate, made from the inside."]},

{name:'Scaffold Shadows',radio:['D|Scaffolding runs above the tents. Guards below cannot light what they cannot aim at.','P|Rooftops, then. Quiet paws.','D|Objective: use the high scaffolds to bypass the dense patrols.'],clues:["Blueprint: 'Rungs spaced for climbing, not for guarding.'","A dead radio crackles: '...it climbs...'"]},
{name:'Embers and Canvas',radio:['D|Campfires are still burning. The glow will make you easier to spot.','P|Then I will keep to the dark between the flames.','D|Objective: reach the far tree line. Crouch behind crates when a lantern swings your way.'],clues:["Burnt letter: 'Embers do not die. They wait.'","A cracked compass, needle fixed on the tower."]},

LEVELS.forEach((L,i)=>{L.reg=Math.floor(i/4);L.radio=L.radio.map(s=>{const k=s.indexOf('|');return{who:s.slice(0,k),text:s.slice(k+1)};});});
const BOSS={
 4:{name:'THE WATCH CAPTAIN',hp:100,w:64,h:96,spd:1.35,captain:true,attacks:['beam','zones','beam']},

 16:{name:'THE RUINED GUARD',hp:130,w:92,h:110,spd:1.25,attacks:['slam','beam','slam','slam']},
 20:{name:'THE TOWER WARDEN',hp:170,w:100,h:124,spd:1.4,phased:true,ph:{1:['beam','slam','charge'],2:['charge','pounce','zones','slam','beam'],3:['beam','charge','pounce','zones','slam','beam']}}
};

/* ===================== AUDIO ===================== */
const Aud={ctx:null,master:null,muted:false,mode:'none',nextT:0,step:0,
 init(){if(this.ctx)return;try{const AC=window.AudioContext||window.webkitAudioContext;this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=this.muted?0:0.5;this.master.connect(this.ctx.destination);}catch(e){}},
 resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
 toggle(){this.muted=!this.muted;if(this.master)this.master.gain.value=this.muted?0:0.5;try{localStorage.setItem('pwt_muted',this.muted?'1':'0');}catch(e){}},
 tone(f,t,d,type,v,f2){const c=this.ctx;if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.15,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+0.05);},
 noise(t,d,v,fc){const c=this.ctx;if(!c)return;const n=Math.max(1,(c.sampleRate*d)|0),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=fc||800;const g=c.createGain();g.gain.setValueAtTime(v||0.2,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(f);f.connect(g);g.connect(this.master);s.start(t);},
 sfx(n){const c=this.ctx;if(!c||this.muted)return;const t=c.currentTime;
  switch(n){
   case 'jump':this.tone(300,t,0.14,'triangle',0.15,520);break;
   case 'djump':this.tone(520,t,0.2,'sine',0.18,980);this.tone(780,t+0.04,0.18,'triangle',0.1,1400);break;
   case 'land':this.noise(t,0.08,0.12,500);break;
   case 'alert':this.tone(880,t,0.1,'square',0.08);this.tone(660,t+0.13,0.1,'square',0.08);this.tone(880,t+0.26,0.1,'square',0.08);break;
   case 'alarm':for(let i=0;i<6;i++)this.tone(i%2?600:900,t+i*0.18,0.17,'sawtooth',0.14);break;
   case 'hit':this.noise(t,0.25,0.3,900);this.tone(120,t,0.2,'sawtooth',0.2,50);break;
   case 'bosshit':this.noise(t,0.3,0.35,1400);this.tone(200,t,0.3,'square',0.2,60);break;
   case 'clang':this.tone(900,t,0.2,'square',0.1,700);this.noise(t,0.1,0.15,3000);break;
   case 'beam':this.tone(1200,t,0.4,'sawtooth',0.12,200);this.noise(t,0.35,0.2,2500);break;
   case 'charge':this.tone(150,t,0.5,'sawtooth',0.1,420);break;
   case 'slam':this.noise(t,0.5,0.5,300);this.tone(90,t,0.5,'sine',0.35,35);break;
   case 'pickup':this.tone(660,t,0.1,'sine',0.15);this.tone(990,t+0.09,0.18,'sine',0.15);break;
   case 'switch':this.tone(200,t,0.08,'square',0.12);this.tone(140,t+0.08,0.14,'square',0.12);break;
   case 'cp':this.tone(440,t,0.15,'triangle',0.12);this.tone(660,t+0.12,0.25,'triangle',0.12);break;
   case 'win':[523,659,784,1047].forEach((f,i)=>this.tone(f,t+i*0.14,0.4,'triangle',0.16));break;
   case 'lose':this.tone(300,t,0.8,'sawtooth',0.15,60);break;
   case 'crumble':this.noise(t,0.3,0.25,600);break;
   case 'blip':this.tone(1100+Math.random()*250,t,0.03,'square',0.035);break;
   case 'menu':this.tone(480,t,0.06,'triangle',0.1);break;
  }},
 music(m){if(this.mode!==m){this.mode=m;this.step=0;if(this.ctx)this.nextT=this.ctx.currentTime+0.05;}},
 tick(){const c=this.ctx;if(!c||this.mode==='none'||this.muted)return;
  if(this.nextT<c.currentTime)this.nextT=c.currentTime+0.05;
  const dt=this.mode==='boss'?0.18:0.5;
  while(this.nextT<c.currentTime+0.3){this.sched(this.nextT);this.nextT+=dt;this.step++;}},
 sched(t){const s=this.step;
  if(this.mode==='over'){
   if(s%16===0){this.tone(55,t,8,'sawtooth',0.07);this.tone(82.4,t,8,'triangle',0.05);}
   if(s%8===0)this.tone([110,98,87.3,110][(s>>3)&3],t,4,'triangle',0.06);
   if(s%3===0&&Math.random()<0.55){const sc=[220,261.6,293.7,329.6,392,440];this.tone(sc[(Math.random()*sc.length)|0],t,1.6,'sine',0.05);}
   if(s%32===20)this.noise(t,2.5,0.04,400);
  }else{
   const bass=[55,55,65.4,55,73.4,55,65.4,49];
   this.tone(bass[s&7],t,0.16,'sawtooth',0.1);
   if(s%4===0){this.tone(140,t,0.2,'sine',0.3,40);}
   if(s%8===6){this.tone(440,t,0.1,'square',0.05);this.tone(466,t,0.1,'square',0.04);}
   if(s%2===1)this.noise(t,0.04,0.06,6000);
   if(s%16===0)this.tone(220,t,2.5,'triangle',0.05,196);
  }}
};
try{Aud.muted=localStorage.getItem('pwt_muted')==='1';}catch(e){}
const sfx=n=>Aud.sfx(n);

/* ===================== INPUT ===================== */
const keys={},pressed={};
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(e.code))e.preventDefault();
  if(!e.repeat&&!keys[e.code])pressed[e.code]=true;keys[e.code]=true;
  Aud.init();Aud.resume();
  if(e.code==='KeyM')Aud.toggle();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
const down=(...c)=>c.some(k=>keys[k]);
const tap=(...c)=>c.some(k=>pressed[k]);
function mpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*VW/r.width,y:(e.clientY-r.top)*VH/r.height};}
cv.addEventListener('mousemove',e=>{const m=mpos(e);for(const b of S.btns||[])if(m.x>b.x&&m.x<b.x+b.w&&m.y>b.y&&m.y<b.y+b.h){if(S.sel!==b.i){S.sel=b.i;}}});
cv.addEventListener('mousedown',e=>{
  Aud.init();Aud.resume();const m=mpos(e);
  const a=S.audioBtn;if(a&&m.x>a.x&&m.x<a.x+a.w&&m.y>a.y&&m.y<a.y+a.h){Aud.toggle();return;}
  for(const b of S.btns||[])if(m.x>b.x&&m.x<b.x+b.w&&m.y>b.y&&m.y<b.y+b.h){S.sel=b.i;pressed['Enter']=true;return;}
  if(S.mode==='radio')pressed['Space']=true;
});

/* ===================== STATE ===================== */
const S={mode:'menu',best:0,selMsg:'',sel:0,btns:[],audioBtn:null,t:0,shake:0,toasts:[],note:null,lvIdx:1,radioIdx:0,radioChars:0,solids:[],clues:new Set(),done:false,overKind:'CAUGHT',stats:null,flash:0,mt:0};
let lv=null,P=null;const cam={x:0,y:0};let parts=[];const embers=[];
for(let i=0;i<70;i++)embers.push({x:Math.random()*VW,y:Math.random()*VH,vx:(Math.random()-.3)*0.6,vy:-0.3-Math.random()*0.9,s:1+Math.random()*2,ph:Math.random()*6});
const SAVE_KEY='panther_water_tower_save_v1';
function readSave(){try{return JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){return null;}}
function writeSave(){try{const far=Math.min(20,S.best+1),replay=S.lvIdx<far;localStorage.setItem(SAVE_KEY,JSON.stringify({level:replay?far:S.lvIdx,cp:!replay&&lv&&lv.respawn?{x:lv.respawn.x,y:lv.respawn.y}:null,best:S.best,clues:[...S.clues],t:Date.now()}));}catch(e){}}
const saved0=readSave();if(saved0&&saved0.clues)saved0.clues.forEach(c=>S.clues.add(c));
if(saved0)S.best=clamp(saved0.best!=null?saved0.best:Math.max(0,(saved0.level||1)-1),0,20);
function toast(m,d){S.toasts.push({m,t:d||150});if(S.toasts.length>3)S.toasts.shift();}

/* ===================== LEVEL BUILD ===================== */
function mkCollap(x,y,w){return{x,y,w,h:16,k:'s',collapse:true,st:0,t:0,off:0,sh:0,trig:false};}
function makeBoss(n,a){
  const D=BOSS[n];
  return{n,name:D.name,hp:D.hp,max:D.hp,w:D.w,h:D.h,x:a.ax+a.aw*0.72,y:a.floor-D.h,vx:0,vy:0,dir:-1,state:'sleep',t:0,atk:0,inv:0,flash:0,beams:[],zones:[],waves:[],wq:0,wq3:0,enraged:false,phase:1,hoverT:0,dead:false,deadT:0,cur:''};
}
function arenaSetup(L,ax,aw,floor){
  L.arena={ax,aw,floor,state:0};
  const spec=[[ax+100,floor-115,150],[ax+aw-250,floor-115,150],[ax+aw/2-100,floor-215,200]];
  for(const [x,y,w] of spec){if(L.n===12)L.collap.push(mkCollap(x,y,w));else L.plats.push({x,y,w,h:16,k:'s'});}
  L.plats.push({x:ax+aw,y:floor-800,w:60,h:1100,k:'w'});
  L.bossE=makeBoss(L.n,L.arena);
  L.cps.push({x:ax-130,y:floor,on:false});
  L.exit={x:ax+aw-110,y:floor};
}
function buildLevel(n){
  const info=LEVELS[n-1],reg=info.reg,R=rng(n*7919+101);
  const L={n,reg,info,boss:!!BOSS[n],plats:[],hide:[],guards:[],lights:[],clues:[],cps:[],switches:[],gates:[],movers:[],collap:[],spikes:[],hounds:[],drones:[],segs:[],W:0,H:600,exit:null,start:null,respawn:null,arena:null,bossE:null,raised:[]};
  if(reg<4)buildHoriz(L,R);else buildTower(L,R);
  // clue records
  L.clueList=[];
  return L;
}
function addGuard(L,R,x1,x2,y,elite){
  const n=L.n,spd=(0.9+Math.min(n,14)*0.035)*(elite?1.25:1);
  const g={x:x1+R()*(x2-x1),y,x1,x2,dir:R()<0.5?-1:1,spd,pause:0,elite,range:elite?300:255,half:elite?0.4:0.38,walk:0,seeing:false};
  g.sx=g.x;L.guards.push(g);
}
function buildHoriz(L,R){
  const n=L.n,reg=L.reg,isBoss=L.boss,BASE=470;L.H=600;
  const runLen=isBoss?2300+n*60:3000+n*120;
  let x=0,y=BASE,i=0,keepY=false;
  const pitP=[(n>=2?0.15:0),0.28,0.7,0.5][reg];
  const add=(px,py,w,h,k)=>{const r={x:px,y:py,w,h,k};L.plats.push(r);return r;};
  while(x<runLen){
    const w=i===0?620:430+R()*360;
    if(i>0&&reg>=2&&!keepY){y=clamp(y+[-70,-35,0,35,60][(R()*5)|0],BASE-80,BASE+60);}
    keepY=false;
    add(x,y,w,L.H+300-y,'g');
    const seg={x,y,w,i,raised:null};L.segs.push(seg);
    x+=w;i++;
    if(x<runLen-250&&R()<pitP){
      let gap;
      if(reg===3){gap=300+R()*60;L.movers.push({x:x+gap/2-55,cx:x+gap/2-55,y:y,w:110,h:14,amp:gap/2-65,sp:0.018+R()*0.01,ph:R()*6,dx:0,dy:0,mover:true,k:'m'});keepY=true;}
      else{gap=120+R()*(reg===2?110:60);
        if(reg===2&&R()<0.6){L.collap.push(mkCollap(x+gap/2-40,y,80));}
        if(reg===2&&R()<0.5)keepY=false;}
      x+=gap;
    }
  }
  // final ground
  if(isBoss){
    const aw=1000,pre=280;add(x,y,pre+aw+60,L.H+300-y,'g');
    arenaSetup(L,x+pre,aw,y);L.W=x+pre+aw+60;
  }else{
    add(x,y,540,L.H+300-y,'g');L.W=x+540;L.exit={x:x+340,y};
    L.segs.push({x,y,w:540,i,raised:null,last:true});
  }
  L.start={x:90,y:BASE};
  const segs=L.segs;
  // raised platforms
  for(const s of segs){
    if(s.w>=450&&!s.last&&s.i>0&&R()<0.65){
      const w=130+R()*80,px=s.x+s.w*(0.25+R()*0.3);
      s.raised=add(px,s.y-125,w,16,(reg===1||reg===3)?'s':'r');L.raised.push(s.raised);
    }
  }
  // guards, grass, crates
  const gp=clamp(0.5+Math.min(n,10)*0.025-(reg>=3?0.1:0),0,0.8);
  for(const s of segs){
    if(s.i===0||s.last)continue;
    const hasG=R()<gp&&s.w>=430;
    if(hasG){
      addGuard(L,R,s.x+45,s.x+s.w-45,s.y,reg>=2);
      if(n>=3&&s.w>520&&R()<(reg>=3?0.3:0.55))addGuard(L,R,s.x+45,s.x+s.w-45,s.y,reg>=2);
    }
    let k=0;
    for(let gx=s.x+(hasG?70:100+R()*150);gx<s.x+s.w-130;gx+=hasG?230:300+R()*200){
      const crate=reg>=1&&R()<0.3;
      L.hide.push({x:gx,y:s.y-46,w:crate?58:120+R()*40,h:46,kind:crate?'crate':'grass'});k++;
    }
  }
  // spikes, hounds, drones
  for(const s of segs){
    if(s.i===0||s.last)continue;
    if(n>=2&&R()<Math.min(0.55,0.35+n*0.015)){const w=44+R()*30,px=s.x+s.w*(0.3+R()*0.4);L.spikes.push({x:px,y:s.y-16,w,h:16});}
    if(n>=3&&s.w>=480&&R()<Math.min(0.4,0.2+n*0.02))L.hounds.push({x:s.x+s.w*0.5,y:s.y,x1:s.x+30,x2:s.x+s.w-30,dir:-1,chase:false,alive:true,t:0});
    if(n>=5&&R()<Math.min(0.4,0.25+n*0.01))L.drones.push({x:s.x+s.w*0.5,x1:s.x+50,x2:s.x+s.w-50,dir:1,spd:1.3+n*0.04,y0:s.y-175,ph:R()*6,y:s.y-175,range:270,half:0.3,ang:Math.PI/2,seeing:false});
  }
  // searchlights on poles
  if(reg===2||n>=6&&reg<4){
    for(const s of segs){
      if(s.i===0||s.last)continue;
      if(R()<(reg>=3?0.55:0.7))L.lights.push({x:s.x+s.w*(0.3+R()*0.4),y:s.y-250,base:Math.PI/2,amp:0.75,sp:0.014+0.0008*Math.max(0,n-9),t:R()*6,range:420,half:0.2,ang:Math.PI/2,seeing:false,pole:true});
    }
    if(!L.lights.length&&segs.length>2)L.lights.push({x:segs[2].x+segs[2].w*0.5,y:segs[2].y-250,base:Math.PI/2,amp:0.75,sp:0.013,t:0,range:420,half:0.2,ang:Math.PI/2,seeing:false,pole:true});
  }
  // puzzles
  if(reg===3){
    const mk=(si,high,id)=>{
      const s=segs[Math.min(si,segs.length-2)];
      const gx=s.x+s.w*0.62;
      L.gates.push({x:gx,y:s.y-700,w:26,h:700,id,open:false});
      let swx=s.x+s.w*0.2,swy=s.y;
      if(high){
        const p1=add(s.x+s.w*0.1,s.y-100,110,16,'r'),p2=add(s.x+s.w*0.1+170,s.y-195,120,16,'r');
        swx=p2.x+p2.w/2;swy=p2.y;
      }
      L.switches.push({x:swx,y:swy,id,on:false});
    };
    if(n===13)mk(2,false,0);
    if(n===14)mk(2,true,0);
    if(n===15){mk(1,false,0);mk(3,true,1);}
    if(n===16)mk(2,false,0);
  }
  // checkpoints
  for(const s of segs){if(s.i>0&&s.i%2===0&&!s.last)L.cps.push({x:s.x+40,y:s.y,on:false});}
  // clues
  for(let k=0;k<2;k++){
    const s=segs[clamp(Math.floor(segs.length*(0.3+0.45*k)),1,segs.length-1)];
    if(s.raised)L.clues.push({x:s.raised.x+s.raised.w/2,y:s.raised.y,k,got:S.clues.has(n+':'+k)});
    else L.clues.push({x:s.x+s.w*0.5,y:s.y,k,got:S.clues.has(n+':'+k)});
  }
  for(const m of L.movers)m.x=m.cx;
}
function buildTower(L,R){
  const n=L.n,steps=[10,13,16,18][n-17],GAP=85,W=1500;
  const gy=steps*GAP+300;L.H=gy+80;L.W=W;
  const add=(px,py,w,h,k)=>{const r={x:px,y:py,w,h,k};L.plats.push(r);return r;};
  add(0,gy,W,260,'g');
  L.start={x:200,y:gy};
  let cursor=250,dir=1,y=gy,tierN=0;const tiers=[];
  for(let i=1;i<=steps;i++){
    y-=GAP;
    const tier=(i%4===0)||(i===steps&&n!==20);
    const w=tier?(i===steps&&n!==20?360:320):150;
    const px=dir>0?cursor:cursor-w;
    if(i===steps&&n===20){
      const ax=px+300,aw=1000;
      L.plats.push({x:px,y,w:300+aw+40,h:24,k:'s'});
      arenaSetup(L,ax,aw,y);L.W=ax+aw+60;
      L.cps.push({x:px+60,y,on:false});
      break;
    }
    const p=add(px,y,w,18,'s');
    cursor=dir>0?px+w+80:px-80;
    if(dir>0&&cursor>1000)dir=-1;else if(dir<0&&cursor<400)dir=1;
    if(tier){tiers.push(p);tierN++;}
    else if(i%2===1&&R()<0.7)L.hide.push({x:px+46,y:y-46,w:58,h:46,kind:'crate'});
    if(tier&&i===steps&&n!==20)L.exit={x:px+w/2,y};
  }
  tiers.forEach((p,k)=>{
    if(p.w<320&&p.y>0&&L.exit&&Math.abs(L.exit.x-(p.x+p.w/2))<5)return;
    if(!(L.exit&&p.y===L.exit.y)){
      addGuard(L,R,p.x+30,p.x+p.w-30,p.y,n>=19);
      L.hide.push({x:p.x+40,y:p.y-46,w:58,h:46,kind:'crate'});
      L.hide.push({x:p.x+p.w-110,y:p.y-46,w:70,h:46,kind:'grass'});
    }
    L.cps.push({x:p.x+p.w/2,y:p.y,on:false});
  });
  // searchlights
  const lp=L.plats.filter(p=>p.k==='s');
  lp.forEach((p,i)=>{
    if(i%3!==1)return;
    const left=(i%2===0);
    L.lights.push({x:left?30:W-30,y:p.y-240,base:left?0.25:Math.PI-0.25,amp:0.55,sp:0.015+(n-17)*0.002,t:R()*6,range:600,half:0.16,ang:0,seeing:false,pole:true});
  });
  lp.forEach((p,i)=>{if(p.w<=150&&i%4===0&&R()<0.5)L.spikes.push({x:p.x+p.w/2-22,y:p.y-16,w:44,h:16});});
  const nd=Math.min(3,n-16);
  for(let k=0;k<nd;k++){const y0=L.H-380-k*((L.H-650)/nd);L.drones.push({x:300+k*330,x1:130,x2:1370,dir:k%2?1:-1,spd:1.2+(n-17)*0.1,y0,ph:R()*6,y:y0,range:270,half:0.3,ang:Math.PI/2,seeing:false});}
  // ground guards
  addGuard(L,R,700,1150,gy,false);
  L.hide.push({x:480,y:gy-46,w:120,h:46,kind:'grass'},{x:1260,y:gy-46,w:120,h:46,kind:'grass'});
  // clues
  const tp=tiers.filter(p=>!L.exit||p.y!==L.exit.y);
  for(let k=0;k<2;k++){const p=tp[Math.min(tp.length-1,1+k)]||L.plats[1];L.clues.push({x:p.x+p.w/2+(k?40:-40),y:p.y,k,got:S.clues.has(n+':'+k)});}
  if(!L.exit&&!L.arena)L.exit={x:700,y:gy};
}

function newPlayer(){return{x:0,y:0,w:46,h:28,vx:0,vy:0,face:1,onGround:false,dj:true,coyote:0,buf:0,crouch:false,stam:100,exhausted:false,hp:100,inv:0,meter:0,hidden:false,ride:null,anim:0,sprinting:false,spirit:0,landV:0,alerted:false};}
function placePlayer(){P.x=lv.respawn.x-P.w/2;P.y=lv.respawn.y-P.h-1;P.vx=P.vy=0;}
function startLevel(n,radio,resp){

function hurt(d,kx){

function lose(kind){S.mode='over';S.overKind=kind;S.mt=0;sfx(kind==='CAUGHT'?'alarm':'lose');Aud.music('none');}
function pm(x,y,n,o){for(let i=0;i<n;i++)parts.push({x:x+(o.rx||0)*(Math.random()-.5),y,vx:(Math.random()-.5)*(o.s||3),vy:(Math.random()-.5)*(o.s||3)+(o.vy||0),life:o.life||30,max:o.life||30,size:o.size||2,col:o.col||'#fff',g:o.g||0,add:!!o.add});}

function buildSolids(){
  const a=lv.plats.slice();
  for(const g of lv.gates)if(!g.open)a.push(g);
  for(const m of lv.movers)a.push(m);
  for(const c of lv.collap)if(c.st<2)a.push(c);
  const ar=lv.arena;
  if(ar&&ar.state===1)a.push({x:ar.ax-30,y:ar.floor-800,w:30,h:1000,k:'w'});
  S.solids=a;
}
function updateMovers(){
  for(const m of lv.movers){const ox=m.x;m.x=m.cx+Math.sin(S.t*m.sp+m.ph)*m.amp;m.dx=m.x-ox;m.dy=0;}
  for(const c of lv.collap){
    if(c.st===0&&c.trig){c.st=1;c.t=36;}
    if(c.st===1){c.t--;c.sh=(Math.random()-.5)*3;if(c.t<=0){c.st=2;c.t=340;c.off=0;sfx('crumble');pm(c.x+c.w/2,c.y,10,{col:'#6a3a28',s:3,life:30,g:0.2,rx:c.w});}}
    else if(c.st===2){c.off+=6;c.t--;if(c.t<=0){c.st=0;c.trig=false;c.off=0;c.sh=0;}}
  }
}
function updatePlayer(){
  const p=P;
  const L=down('ArrowLeft','KeyA'),Rr=down('ArrowRight','KeyD');
  const wantC=down('KeyC','KeyS','ArrowDown');
  if(wantC&&!p.crouch&&p.onGround){p.crouch=true;p.y+=p.h-18;p.h=18;}
  if(!wantC&&p.crouch){
    const t={x:p.x,y:p.y-(28-p.h),w:p.w,h:28};
    if(!S.solids.some(s=>ov(t,s))){p.y=t.y;p.h=28;p.crouch=false;}
  }
  const dir=(Rr?1:0)-(L?1:0);if(dir)p.face=dir;
  let sp=3.5;p.sprinting=false;
  if(p.crouch)sp=1.5;
  else if(down('ShiftLeft','ShiftRight')&&dir&&!p.exhausted&&p.stam>0){sp=6.2;p.sprinting=true;p.stam-=0.7;if(p.stam<=0){p.stam=0;p.exhausted=true;}}
  if(!p.sprinting){p.stam=Math.min(100,p.stam+(dir?0.16:0.3));if(p.exhausted&&p.stam>25)p.exhausted=false;}
  p.vx+=(dir*sp-p.vx)*(p.onGround?0.35:0.18);if(Math.abs(p.vx)<0.05)p.vx=0;
  p.coyote=p.onGround?7:p.coyote-1;
  const jk=['Space','KeyW','ArrowUp'];
  if(tap(...jk))p.buf=7;else p.buf--;
  if(p.buf>0&&!p.crouch){
    if(p.coyote>0){p.vy=-11.2;p.coyote=0;p.buf=0;p.onGround=false;sfx('jump');pm(p.x+p.w/2,p.y+p.h,5,{col:'#6a3a38',s:2,life:20,g:0.05});}
    else if(p.dj){p.vy=-10.4;p.dj=false;p.buf=0;p.spirit=24;sfx('djump');pm(p.x+p.w/2,p.y+p.h,16,{col:'#bfe8ff',s:4,life:34,add:true,size:2.5,vy:1});}
  }
  if(p.vy<-4&&!down(...jk))p.vy+=0.9;
  // ride
  if(p.ride){p.x+=p.ride.dx||0;p.y+=p.ride.dy||0;}
  p.ride=null;
  // x move
  p.x+=p.vx;
  for(const s of S.solids){if(ov(p,s)){if(p.vx>0||(p.vx===0&&p.x+p.w/2<s.x+s.w/2))p.x=s.x-p.w;else p.x=s.x+s.w;}}
  // y move
  p.vy=Math.min(p.vy+G,MAXFALL);p.y+=p.vy;
  const was=p.onGround;p.onGround=false;
  for(const s of S.solids){
    if(ov(p,s)){
      if(p.vy>0){p.y=s.y-p.h;p.onGround=true;p.landV=p.vy;if(s.mover)p.ride=s;if(s.collapse)s.trig=true;p.vy=0;}
      else if(p.vy<0){p.y=s.y+s.h;p.vy=0;}
      else p.y=s.y-p.h;
    }
  }
  if(p.onGround){p.dj=true;if(!was&&p.landV>7){sfx('land');pm(p.x+p.w/2,p.y+p.h,8,{col:'#6a3a38',s:3,life:24,g:0.05,rx:20});}}
  if(Math.abs(p.vx)>0.4&&p.onGround)p.anim+=Math.abs(p.vx)*0.07;
  if(p.inv>0)p.inv--;if(p.spirit>0)p.spirit--;
  if(p.sprinting&&p.onGround&&S.t%4===0)pm(p.x+p.w/2-p.face*20,p.y+p.h,1,{col:'#5a2a2c',s:1.5,life:20,g:-0.02});
  if(p.y>lv.H+160){
    p.hp-=25;sfx('hit');S.shake=8;
    if(p.hp<=0){p.hp=0;lose('DOWN');}else{toast('You fell. Health lost.');placePlayer();p.meter=0;p.inv=60;}
  }
}
/* ===================== GUARDS / DETECTION ===================== */
function updateGuards(){
  for(const g of lv.guards){
    if(g.pause>0){g.pause--;continue;}
    g.x+=g.dir*g.spd;g.walk+=0.14;
    if(g.x<g.x1){g.x=g.x1;g.dir=1;g.pause=50;}else if(g.x>g.x2){g.x=g.x2;g.dir=-1;g.pause=50;}
  }
  for(const l of lv.lights){l.t+=l.sp;l.ang=l.base+Math.sin(l.t)*l.amp;}
}
function detection(){
  const p=P,cx=p.x+p.w/2,cy=p.y+p.h/2;
  p.hidden=p.crouch&&lv.hide.some(h=>cx>h.x&&cx<h.x+h.w&&cy>h.y&&cy<h.y+h.h);
  let seen=false,mul=1;
  for(const g of lv.guards)g.seeing=false;for(const l of lv.lights)l.seeing=false;for(const d of lv.drones)d.seeing=false;
  if(!p.hidden&&!(lv.arena&&lv.arena.state===1)){
    for(const g of lv.guards){const a=g.dir>0?0.3:Math.PI-0.3;if(inCone(g.x+g.dir*18,g.y-48,a,g.half,g.range,cx,cy)){g.seeing=true;seen=true;mul=Math.max(mul,g.elite?1.2:1);}}
    for(const l of lv.lights){if(inCone(l.x,l.y,l.ang,l.half,l.range,cx,cy)){l.seeing=true;seen=true;mul=Math.max(mul,1.1);}}
    for(const d of lv.drones){if(inCone(d.x,d.y+8,d.ang,d.half,d.range,cx,cy)){d.seeing=true;seen=true;mul=Math.max(mul,1.1);}}
  }
  if(seen){
    p.meter+=(p.crouch?0.9:1.6)*(p.sprinting?1.25:1)*mul;
    if(!p.alerted&&p.meter>35){p.alerted=true;sfx('alert');}
  }else{p.meter-=p.hidden?1.3:0.6;if(p.meter<25)p.alerted=false;}
  p.meter=clamp(p.meter,0,100);
  if(p.meter>=100)lose('CAUGHT');
}
/* ===================== BOSS ===================== */
function bossVuln(b){
  if(b.state==='intro'||b.state==='sleep'||b.dead)return false;
  const D=BOSS[b.n];
  if(D.captain)return b.state==='rest';
  return b.state!=='dash'&&b.state!=='jump'&&b.state!=='pounce'&&b.state!=='dive';
}
function startAtk(b,k){
  const a=lv.arena,pcx=P.x+P.w/2,bcx=b.x+b.w/2;b.cur=k;
  if(k==='beam'){b.state='beam';b.t=78;const cnt=(b.phase>=3?6:b.n===4?5:4)+(b.enraged?1:0);b.beams=[];
    for(let i=0;i<cnt;i++){const x=i===0?pcx:pcx+(Math.random()*2-1)*280;b.beams.push({x:clamp(x,a.ax+30,a.ax+a.aw-30)});}sfx('charge');}
  else if(k==='pounce'){b.state='ptele';b.t=32;b.dir=pcx>bcx?1:-1;sfx('charge');}
  else if(k==='dive'){b.state='dtele';b.t=34;sfx('charge');}
  else if(k==='charge'){b.state='tele';b.t=44;b.dir=pcx>bcx?1:-1;sfx('charge');}
  else if(k==='slam'){b.state='jump';b.vy=-15;b.vx=clamp((pcx-bcx)/38,-9,9);b.t=999;sfx('charge');}
  else if(k==='zones'){b.state='zones';b.t=150;b.zones=[];const cnt=(b.phase>=3?6:5)+(b.enraged?1:0);
    for(let i=0;i<cnt;i++)b.zones.push({x:clamp(pcx+(Math.random()*2-1)*320,a.ax+60,a.ax+a.aw-60),y:a.floor-30-Math.random()*170,r:46,t:-i*8});}
}
function nextAttack(b){const D=BOSS[b.n];const list=D.phased?D.ph[b.phase]:D.attacks;startAtk(b,list[b.atk++%list.length]);}
function spawnWaves(b){const bcx=b.x+b.w/2,sp=6+b.phase*0.6+(b.enraged?1.5:0);b.waves.push({x:bcx,dir:1,sp},{x:bcx,dir:-1,sp});}
function killBoss(b){
  b.dead=true;b.state='dead';b.beams=[];b.zones=[];b.waves=[];lv.arena.state=2;S.shake=24;sfx('slam');
  pm(b.x+b.w/2,b.y+b.h/2,60,{col:'#ffb040',s:9,life:60,add:true,size:3});
  toast('THE GATE OPENS. REACH THE EXIT.',240);Aud.music('over');
}
function updateBoss(){
  const b=lv.bossE,a=lv.arena;if(!b)return;
  const p=P,pcx=p.x+p.w/2;
  if(a.state===0){if(p.x>a.ax+90){a.state=1;b.state='intro';b.t=130;S.shake=14;sfx('slam');toast('THE GATE SEALS BEHIND YOU',180);Aud.music('boss');}return;}
  if(b.dead){b.deadT++;if(b.deadT%5===0&&b.deadT<80)pm(b.x+b.w/2,b.y+b.h/2,6,{col:'#ffb040',s:6,life:40,add:true,size:2.5,rx:b.w});return;}
  const D=BOSS[b.n];
  b.t--;if(b.inv>0)b.inv--;if(b.flash>0)b.flash--;
  let sp=D.spd;
  if(D.phased){const fr=b.hp/b.max,ph=fr>0.66?1:fr>0.33?2:3;
    if(ph!==b.phase){b.phase=ph;toast('PHASE '+ph,150);S.shake=16;sfx('slam');b.t=Math.min(b.t,25);}
    sp*=[1,1,1.25,1.5][ph];}
  if(!D.phased&&b.hp<b.max*0.5){if(!b.enraged){b.enraged=true;toast('ENRAGED!',120);S.shake=14;sfx('slam');}sp*=1.15;}
  const bcx=b.x+b.w/2,minX=a.ax+(D.captain?300:20),maxX=a.ax+a.aw-b.w-20;
  if(D.fly){b.hoverT++;if(['walk','zones','rest','dtele','beam'].includes(b.state)){const ty=a.floor-b.h-(30+(Math.sin(b.hoverT*0.025)+1)/2*120);b.y+=(ty-b.y)*0.12;}}
  else if(['walk','rest','tele','ptele','beam','zones','slamrest','pounceland'].includes(b.state)){
    let gy=a.floor;
    for(const r of lv.plats)if(r.k==='s'&&r.y>a.floor-500&&r.y<a.floor&&bcx>r.x&&bcx<r.x+r.w&&r.y>=b.y+b.h-4&&r.y<gy)gy=r.y;
    for(const r of lv.collap)if(r.st<2&&bcx>r.x&&bcx<r.x+r.w&&r.y>=b.y+b.h-4&&r.y<gy)gy=r.y;
    if(b.y+b.h<gy-0.5){b.vy+=0.6;b.y=Math.min(b.y+b.vy,gy-b.h);}else{b.y=gy-b.h;b.vy=0;}
  }
  switch(b.state){
    case 'intro':if(b.t<=0){b.state='walk';b.t=60;}break;
    case 'walk':
      if(D.captain){b.x+=b.dir*sp;if(b.x<minX){b.x=minX;b.dir=1;}if(b.x>maxX){b.x=maxX;b.dir=-1;}}
      else{b.dir=pcx>bcx?1:-1;if(Math.abs(pcx-bcx)>30)b.x+=b.dir*sp*(D.fly?0.7:1);}
      b.x=clamp(b.x,minX,maxX);
      if(b.t<=0)nextAttack(b);break;
    case 'beam':
      if(b.t===30){sfx('beam');S.shake=6;}
      if(b.t<=30&&b.t>0)for(const bm of b.beams)if(Math.abs(pcx-bm.x)<26)hurt(20,pcx<bm.x?-1:1);
      if(b.t<=0){b.beams=[];if(D.captain){b.state='rest';b.t=200;}else{b.state='walk';b.t=50;}}break;
    case 'tele':if(b.t<=0){b.state='dash';b.dir=pcx>bcx?1:-1;b.vx=b.dir*(11+b.phase);b.t=70;sfx('slam');}break;
    case 'dash':
      b.x+=b.vx;
      if(b.x<minX||b.x>maxX){b.x=clamp(b.x,minX,maxX);b.state='rest';b.t=75;S.shake=10;sfx('slam');}
      else if(b.t<=0){b.state='rest';b.t=75;}
      if(S.t%3===0)pm(b.x+b.w/2,b.y+b.h,1,{col:'#8a4a3a',s:2,life:20});break;
    case 'jump':
      b.vy+=0.6;b.y+=b.vy;b.x=clamp(b.x+b.vx,minX,maxX);
      if(b.vy>0&&b.y>=a.floor-b.h){b.y=a.floor-b.h;b.state='slamrest';b.t=85;b.wq=26;b.wq3=b.n>=16?52:0;spawnWaves(b);S.shake=14;sfx('slam');pm(b.x+b.w/2,a.floor,16,{col:'#8a4a3a',s:6,life:30,g:0.1,rx:b.w});}break;
    case 'slamrest':if(b.wq>0){b.wq--;if(b.wq===0){spawnWaves(b);sfx('slam');}}if(b.wq3>0){b.wq3--;if(b.wq3===0){spawnWaves(b);sfx('slam');}}if(b.t<=0){b.state='walk';b.t=40;}break;
    case 'zones':
      for(const z of b.zones){z.t++;if(z.t===60)sfx('beam');
        if(z.t>=60&&z.t<150){const dx=pcx-z.x,dy=(p.y+p.h/2)-z.y;if(Math.hypot(dx,dy)<z.r+12)hurt(18,dx<0?-1:1);}}
      if(b.t<=0){b.zones=[];b.state=D.captain?'rest':'walk';b.t=D.captain?150:35;}break;
    case 'rest':if(b.t<=0){b.state='walk';b.t=35;}break;
    case 'ptele':if(b.t<=0){
      const g2=0.6,B0=b.y+b.h,tb=p.y+p.h,dl=tb-B0,vy0=-Math.sqrt(2*g2*(Math.max(0,-dl)+90)),tt=(-vy0+Math.sqrt(vy0*vy0+2*g2*dl))/g2;
      b.vy=vy0;b.vx=clamp((pcx-bcx)/Math.max(8,tt),-14,14);b.state='pounce';b.t=200;sfx('slam');}break;
    case 'pounce':{
      b.vy+=0.6;const pb=b.y+b.h;b.y+=b.vy;b.x=clamp(b.x+b.vx,minX,maxX);const nb=b.y+b.h,bc2=b.x+b.w/2;
      if(b.vy>0){let land=null;
        if(nb>=a.floor)land=a.floor;
        for(const r of lv.plats)if(r.k==='s'&&r.y>a.floor-500&&r.y<a.floor&&bc2>r.x-8&&bc2<r.x+r.w+8&&pb<=r.y+2&&nb>=r.y&&(land===null||r.y<land))land=r.y;
        for(const r of lv.collap)if(r.st<2&&bc2>r.x-8&&bc2<r.x+r.w+8&&pb<=r.y+2&&nb>=r.y&&(land===null||r.y<land))land=r.y;
        if(land!==null){b.y=land-b.h;b.vy=0;b.state='pounceland';b.t=45;S.shake=12;sfx('slam');pm(b.x+b.w/2,land,14,{col:'#8a4a3a',s:6,life:28,g:0.1,rx:b.w});}}
      break;}
    case 'pounceland':if(b.t<=0){b.state='walk';b.t=30;}break;
    case 'dtele':if(b.t<=0){const tx=pcx-bcx,ty=(p.y+p.h/2)-(b.y+b.h/2),d=Math.hypot(tx,ty)||1,s2=11+(b.enraged?2:0);b.vx=tx/d*s2;b.vy=ty/d*s2;b.state='dive';b.t=50;sfx('slam');}break;
    case 'dive':
      b.x=clamp(b.x+b.vx,minX,maxX);b.y+=b.vy;
      if(b.y+b.h>=a.floor){b.y=a.floor-b.h;b.state='rest';b.t=60;S.shake=10;sfx('slam');pm(b.x+b.w/2,a.floor,12,{col:'#8a4a3a',s:5,life:26,g:0.1,rx:b.w});}
      else if(b.t<=0||b.x<=minX||b.x>=maxX){b.state='rest';b.t=55;}
      break;
  }
  // shockwaves
  for(let i=b.waves.length-1;i>=0;i--){
    const w=b.waves[i];w.x+=w.dir*w.sp;
    const r={x:w.x-18,y:a.floor-28,w:36,h:28};
    if(ov(p,r))hurt(22,w.dir);
    if(w.x<a.ax||w.x>a.ax+a.aw)b.waves.splice(i,1);
  }
  // contact
  if(b.state!=='intro'&&ov(p,b)){
    const prevB=p.y+p.h-p.vy;
    if(p.vy>0&&prevB<=b.y+26){
      if(bossVuln(b)&&b.inv<=0){b.hp-=12;b.inv=60;b.flash=14;S.shake=10;sfx('bosshit');toast('-12',50);pm(b.x+b.w/2,b.y,16,{col:'#ffd070',s:6,life:30,add:true});if(b.hp<=0){b.hp=0;killBoss(b);}}
      else{sfx('clang');pm(b.x+b.w/2,b.y,8,{col:'#aaa',s:4,life:18,add:true});}
      p.vy=-9;p.dj=true;p.y=b.y-p.h-1;
    }else hurt(b.state==='dash'||b.state==='dive'||b.state==='pounce'?26:17,pcx<b.x+b.w/2?-1:1);
  }
}

/* ===================== PLAY UPDATE ===================== */
function nearObj(o,r){const cx=P.x+P.w/2,cy=P.y+P.h/2;return Math.abs(cx-o.x)<(r||48)&&Math.abs(cy-(o.y-20))<70;}
function updateEnemies(){
  const p=P,pcx=p.x+p.w/2,pcy=p.y+p.h/2;
  for(const d of lv.drones){d.x+=d.dir*d.spd;if(d.x<d.x1){d.x=d.x1;d.dir=1;}if(d.x>d.x2){d.x=d.x2;d.dir=-1;}d.ph+=0.05;d.y=d.y0+Math.sin(d.ph)*22;d.ang=Math.PI/2+Math.sin(d.ph*0.7)*0.5;}
  for(const s of lv.spikes)if(ov(p,s))hurt(15,pcx<s.x+s.w/2?-1:1);
  for(const h of lv.hounds){
    if(!h.alive)continue;
    const near=Math.abs(pcx-h.x)<300&&Math.abs(pcy-(h.y-13))<90&&(!p.hidden||Math.abs(pcx-h.x)<110);
    if(near)h.chase=true;else if(h.chase&&Math.abs(pcx-h.x)>420)h.chase=false;
    if(h.chase){h.dir=pcx>h.x?1:-1;h.x+=h.dir*3.4;if(!p.hidden&&p.meter<80)p.meter+=0.2;}
    else{h.x+=h.dir*1.2;if(h.x<h.x1){h.x=h.x1;h.dir=1;}if(h.x>h.x2){h.x=h.x2;h.dir=-1;}}
    h.x=clamp(h.x,h.x1,h.x2);h.t+=0.3;
    const r={x:h.x-22,y:h.y-26,w:44,h:26};
    if(ov(p,r)){
      const prevB=p.y+p.h-p.vy;
      if(p.vy>0&&prevB<=r.y+14){h.alive=false;p.vy=-9;p.dj=true;sfx('bosshit');pm(h.x,h.y-14,14,{col:'#ff6040',s:5,life:26,add:true});}
      else hurt(18,pcx<h.x?-1:1);
    }
  }
}
function updatePlay(){
  S.t++;
  if(tap('Escape','KeyP')){S.mode='pause';S.sel=0;return;}
  buildSolids();updateMovers();
  updatePlayer();
  updateGuards();updateEnemies();detection();
  if(S.mode!=='play')return;
  updateBoss();
  if(S.mode!=='play')return;
  S.hint=null;
  for(const c of lv.clues){if(!c.got&&nearObj(c)){S.hint='[E] Read journal clue';if(tap('KeyE')){c.got=true;S.clues.add(lv.n+':'+c.k);S.note={text:lv.info.clues[c.k],t:330};sfx('pickup');writeSave();}}}
  for(const s of lv.switches){if(nearObj(s)){S.hint='[E] Pull switch';if(tap('KeyE')){s.on=!s.on;for(const g of lv.gates)if(g.id===s.id)g.open=s.on;sfx('switch');toast(s.on?'A gate groans open.':'A gate slams shut.');}}}
  for(const c of lv.cps){if(!c.on&&P.x>c.x){c.on=true;lv.respawn={x:c.x,y:c.y};P.hp=Math.min(100,P.hp+35);P.stam=100;sfx('cp');toast('CHECKPOINT  -  health restored');writeSave();}}
  if(lv.exit){
    const active=!lv.bossE||lv.bossE.dead;
    if(active&&ov(P,{x:lv.exit.x-34,y:lv.exit.y-100,w:68,h:100}))levelClear();
    else if(!active&&false){}
  }
  // particles
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx;q.y+=q.vy;q.vy+=q.g;q.life--;if(q.life<=0)parts.splice(i,1);}
  if(S.note){S.note.t--;if(S.note.t<=0)S.note=null;}
  updateCam();
}
function levelClear(){
  const got=lv.clues.filter(c=>c.got).length;
  S.stats={n:lv.n,got};sfx('win');S.mode='clear';Aud.music('none');
  if(lv.n===20){S.done=true;S.mode='win';}
  S.best=Math.max(S.best,lv.n);try{localStorage.setItem(SAVE_KEY,JSON.stringify({level:Math.min(20,S.best+1),cp:null,best:S.best,clues:[...S.clues],done:lv.n===20,t:Date.now()}));}catch(e){}
}
function clampCam(snap){
  let tx=P.x+P.w/2-VW/2+P.face*50,ty=P.y-VH*0.6;
  const ar=lv.arena;
  if(ar&&ar.state===1){tx=clamp(tx,ar.ax-10,ar.ax+ar.aw-VW+50);}
  tx=clamp(tx,0,Math.max(0,lv.W-VW));ty=clamp(ty,0,Math.max(0,lv.H-VH));
  if(snap){cam.x=tx;cam.y=ty;}else{cam.x=lerp(cam.x,tx,0.12);cam.y=lerp(cam.y,ty,0.1);}
}
function updateCam(){clampCam(false);}

/* ===================== MENUS ===================== */
function menuItems(){
  if(S.mode==='menu'){
    const sv=readSave(),it=[];
    if(sv&&sv.level)it.push({l:'CONTINUE  (Chapter '+sv.level+')',f:()=>{S.clues=new Set(sv.clues||[]);S.best=clamp(sv.best!=null?sv.best:Math.max(0,sv.level-1),0,20);startLevel(sv.level,true,sv.cp);}});
    it.push({l:'NEW GAME'+(S.best>0?'  (resets progress)':''),f:()=>{S.clues=new Set();S.best=0;try{localStorage.removeItem(SAVE_KEY);}catch(e){}startLevel(1,true);}});
    it.push({l:'LEVEL SELECT',f:()=>{S.mode='select';S.sel=Math.min(S.best,19);S.selMsg='';}});
    it.push({l:'CONTROLS',f:()=>{S.mode='controls';}});
    it.push({l:'AUDIO: '+(Aud.muted?'OFF':'ON'),f:()=>Aud.toggle()});
    return it;
  }
  if(S.mode==='pause')return[
    {l:'RESUME',f:()=>{S.mode='play';}},
    {l:'SAVE GAME',f:()=>{writeSave();toast('Progress saved.');S.mode='play';}},
    {l:'RESTART FROM CHECKPOINT',f:()=>startLevel(lv.n,false,lv.respawn)},
    {l:'RESTART CHAPTER',f:()=>startLevel(lv.n,false)},
    {l:'AUDIO: '+(Aud.muted?'OFF':'ON'),f:()=>Aud.toggle()},
    {l:'QUIT TO MENU',f:()=>{writeSave();S.mode='menu';S.sel=0;Aud.music('none');}}];
  return[];
}
function updateMenu(){
  const it=menuItems();if(!it.length)return;
  if(tap('ArrowUp','KeyW')){S.sel=(S.sel+it.length-1)%it.length;sfx('menu');}
  if(tap('ArrowDown','KeyS')){S.sel=(S.sel+1)%it.length;sfx('menu');}
  S.sel=clamp(S.sel,0,it.length-1);
  if(tap('Enter','Space')){sfx('menu');const f=it[S.sel].f;f();}
  if(S.mode==='pause'&&tap('Escape','KeyP'))S.mode='play';
}
function update(){
  S.mt++;
  switch(S.mode){
    case 'menu':case 'pause':updateMenu();if(S.mode==='menu'){cam.x+=0.8;}break;
    case 'controls':if(tap('Enter','Escape','Space')){S.mode='menu';S.sel=0;}break;
    case 'select':{
      let i=S.sel;
      if(tap('ArrowLeft','KeyA'))i=Math.max(0,i-1);
      if(tap('ArrowRight','KeyD'))i=Math.min(19,i+1);
      if(tap('ArrowUp','KeyW'))i=Math.max(0,i-4);
      if(tap('ArrowDown','KeyS'))i=Math.min(19,i+4);
      if(i!==S.sel){S.sel=i;sfx('menu');S.selMsg='';}
      if(tap('Enter','Space')){
        if(S.sel+1<=S.best+1){sfx('menu');startLevel(S.sel+1,true);}
        else{sfx('clang');S.selMsg='Locked. Beat chapter '+(S.best+1)+' to unlock this one.';}
      }
      if(tap('Escape')){S.mode='menu';S.sel=0;}
      break;}
    case 'radio':{
      const r=lv.info.radio[S.radioIdx];
      if(S.radioChars<r.text.length){S.radioChars+=1.3;if(S.t++%3===0)sfx('blip');}
      if(tap('Space','Enter')){if(S.radioChars<r.text.length)S.radioChars=r.text.length;else{S.radioIdx++;S.radioChars=0;if(S.radioIdx>=lv.info.radio.length){S.mode='play';sfx('menu');}}}
      if(tap('Escape','Tab'))S.mode='play';
      for(const q of embers){}
      break;}
    case 'play':updatePlay();break;
    case 'over':if(tap('Enter','Space'))startLevel(lv.n,false,lv.respawn);if(tap('Escape')){S.mode='menu';S.sel=0;}break;
    case 'clear':if(tap('Enter','Space'))startLevel(lv.n+1,true);break;
    case 'win':if(tap('Enter','Space')){S.mode='menu';S.sel=0;}break;
  }
  for(const q of embers){q.x+=q.vx+Math.sin(S.mt*0.02+q.ph)*0.3;q.y+=q.vy;if(q.y<-10){q.y=VH+10;q.x=Math.random()*VW;}if(q.x<-10)q.x=VW+10;if(q.x>VW+10)q.x=-10;}
  if(S.shake>0)S.shake*=0.88;if(S.shake<0.3)S.shake=0;
  if(S.flash>0)S.flash--;
  for(let i=S.toasts.length-1;i>=0;i--){S.toasts[i].t--;if(S.toasts[i].t<=0)S.toasts.splice(i,1);}
  Aud.tick();
}

/* ===================== RENDER HELPERS ===================== */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function txt(s,x,y,size,col,align,w){ctx.font=(w||'')+' '+size+'px Georgia, "Times New Roman", serif';ctx.fillStyle=col;ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';ctx.fillText(s,x,y);}
function wrap(s,maxW,size,w){ctx.font=(w||'')+' '+size+'px Georgia, serif';const words=s.split(' '),lines=[];let cur='';for(const wd of words){const t=cur?cur+' '+wd:wd;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=wd;}else cur=t;}if(cur)lines.push(cur);return lines;}
function pines(off,base,spacing,minH,maxH,col,seed){
  ctx.fillStyle=col;const i0=Math.floor(off/spacing)-1,cnt=Math.ceil(VW/spacing)+3;
  const pts=[[0,-1],[0.45,-0.55],[0.25,-0.55],[0.7,-0.22],[0.4,-0.22],[0.95,0]];
  for(let k=0;k<cnt;k++){
    const i=i0+k,hh=minH+(maxH-minH)*hash(i*13+seed),x=i*spacing-off+hash(i*7+seed)*spacing*0.6,w=hh*0.36;
    ctx.beginPath();ctx.moveTo(x,base-hh);
    for(let j=1;j<pts.length;j++)ctx.lineTo(x+pts[j][0]*w,base+pts[j][1]*hh);
    for(let j=pts.length-1;j>=1;j--)ctx.lineTo(x-pts[j][0]*w,base+pts[j][1]*hh);
    ctx.closePath();ctx.fill();
  }
  ctx.fillRect(0,base-1,VW,VH);
}
function hills(off,base,amp,col,seed){
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,VH);
  for(let x=0;x<=VW;x+=20){const wx=x+off;const y=base-amp*(0.5*Math.sin(wx*0.004+seed)+0.3*Math.sin(wx*0.011+seed*2)+0.2*Math.sin(wx*0.027));ctx.lineTo(x,y);}
  ctx.lineTo(VW,VH);ctx.closePath();ctx.fill();
}
function drawBG(cx,cy,n){
  const g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#1d0208');g.addColorStop(0.5,'#6e0a18');g.addColorStop(1,'#c4281c');
  ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  // moon
  const mx=730-cx*0.02,my=105-cy*0.03;
  const mg=ctx.createRadialGradient(mx,my,10,mx,my,150);mg.addColorStop(0,'rgba(255,230,220,0.45)');mg.addColorStop(1,'rgba(255,200,200,0)');
  ctx.fillStyle=mg;ctx.fillRect(mx-160,my-160,320,320);
  ctx.fillStyle='#f1e4da';ctx.beginPath();ctx.arc(mx,my,40,0,7);ctx.fill();
  ctx.fillStyle='rgba(160,130,130,0.35)';[[-12,-8,9],[10,6,7],[-2,16,5],[14,-14,4]].forEach(c=>{ctx.beginPath();ctx.arc(mx+c[0],my+c[1],c[2],0,7);ctx.fill();});
  // distant tower
  const tx=820-cx*0.03,ty=330-cy*0.08,sc=0.5+n*0.045;
  ctx.fillStyle='#30060e';
  ctx.beginPath();ctx.ellipse(tx,ty-90*sc,36*sc,28*sc,0,0,7);ctx.fill();
  ctx.fillRect(tx-36*sc,ty-92*sc,72*sc,18*sc);
  ctx.lineWidth=4*sc;ctx.strokeStyle='#30060e';ctx.beginPath();
  ctx.moveTo(tx-30*sc,ty-70*sc);ctx.lineTo(tx-40*sc,ty+90);ctx.moveTo(tx+30*sc,ty-70*sc);ctx.lineTo(tx+40*sc,ty+90);
  ctx.moveTo(tx-34*sc,ty-40*sc);ctx.lineTo(tx+34*sc,ty+10*sc);ctx.moveTo(tx+34*sc,ty-40*sc);ctx.lineTo(tx-34*sc,ty+10*sc);ctx.stroke();
  hills(cx*0.08,410-cy*0.05,70,'#3d0712',1);
  pines(cx*0.18,440-cy*0.07,70,110,170,'#2a050c',3);
  pines(cx*0.35,480-cy*0.1,90,150,230,'#1a0308',9);
  // mist
  const mg2=ctx.createLinearGradient(0,330,0,VH);mg2.addColorStop(0,'rgba(200,40,40,0)');mg2.addColorStop(1,'rgba(160,20,30,0.25)');
  ctx.fillStyle=mg2;ctx.fillRect(0,330,VW,VH);
  if(cy>200){ctx.fillStyle='rgba(8,0,3,'+clamp(cy/2400,0,0.5)+')';ctx.fillRect(0,0,VW,VH);}
}
function drawEmbers(){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const q of embers){const a=0.4+0.4*Math.sin(S.mt*0.05+q.ph);ctx.fillStyle='rgba(255,'+(120+q.s*30|0)+',60,'+a*0.7+')';ctx.beginPath();ctx.arc(q.x,q.y,q.s,0,7);ctx.fill();}
  ctx.restore();
}
function drawHead(cx,cy,s,alpha){
  ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);ctx.globalAlpha=alpha||1;
  ctx.fillStyle='#08080e';
  ctx.beginPath();ctx.moveTo(-18,-6);ctx.lineTo(-16,-24);ctx.lineTo(-5,-14);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(18,-6);ctx.lineTo(16,-24);ctx.lineTo(5,-14);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.ellipse(0,0,19,16,0,0,7);ctx.fill();
  ctx.strokeStyle='#8a1b2b';ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(0,0,19,16,0,Math.PI*1.1,Math.PI*1.9);ctx.stroke();
  ctx.shadowColor='#ffd34a';ctx.shadowBlur=8;ctx.fillStyle='#ffd34a';
  ctx.beginPath();ctx.ellipse(-8,-3,4.2,2.8,0.3,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(8,-3,4.2,2.8,-0.3,0,7);ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='#000';ctx.fillRect(-8.6,-5.2,1.4,4.4);ctx.fillRect(7.2,-5.2,1.4,4.4);
  ctx.fillStyle='#3a2a30';ctx.beginPath();ctx.moveTo(-3,5);ctx.lineTo(3,5);ctx.lineTo(0,9);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(220,200,200,0.5)';ctx.lineWidth=0.8;
  for(const d of[-1,1])for(let k=0;k<3;k++){ctx.beginPath();ctx.moveTo(d*8,7+k*1.5);ctx.lineTo(d*27,4+k*5);ctx.stroke();}

      if(!open){ctx.fillStyle='#6a5a5a';rr(x+cw-30,y+36,16,13,2);ctx.fill();ctx.strokeStyle='#6a5a5a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+cw-22,y+36,5,Math.PI,0);ctx.stroke();}
      S.btns.push({x,y,w:cw,h:ch,i});
    }
  }
  txt(S.selMsg||'Beat a chapter to unlock the next.     [ARROWS] choose     [ENTER] play     [ESC] back',VW/2,VH-12,12,S.selMsg?'#ff9090':'#c8a0a0','center',S.selMsg?'bold':'');
}
function drawRadio(){
  const r=lv.info.radio[S.radioIdx],y=VH-190,h=176;
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle='rgba(8,4,8,.94)';rr(30,y,VW-60,h,12);ctx.fill();ctx.strokeStyle='#c0303e';ctx.lineWidth=2;rr(30,y,VW-60,h,12);ctx.stroke();
  // header
  ctx.fillStyle='rgba(120,16,32,.9)';rr(30,y,VW-60,28,12);ctx.fill();ctx.fillRect(30,y+14,VW-60,14);
  txt('\u25C9 RADIO TRANSMISSION  -  CHAPTER '+lv.n+': '+lv.info.name.toUpperCase(),48,y+19,12,'#ffe9e0','left','bold');
  txt(REGIONS[lv.reg],VW-48,y+19,10,'#ffc8c0','right');
  // portrait
  const d=r.who==='D';
  ctx.fillStyle='#14080c';rr(48,y+42,92,92,10);ctx.fill();ctx.strokeStyle=d?'#4a9aff':'#ffd34a';ctx.lineWidth=2;rr(48,y+42,92,92,10);ctx.stroke();
  if(d){ctx.strokeStyle='#6aaaff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(94,y+88,22,0,7);ctx.stroke();
    for(let i=0;i<5;i++){const hh=6+Math.abs(Math.sin(S.mt*0.2+i*1.3))*22;ctx.fillStyle='#6aaaff';ctx.fillRect(80+i*7,y+88-hh/2,4,hh);}}
  else drawHead(94,y+92,1.7,1);
  txt(d?'BASE COMMAND':NAME,94,y+150,11,d?'#8ab8ff':'#ffd34a','center','bold');
  const lines=wrap(r.text.slice(0,Math.floor(S.radioChars)),VW-260,17);
  lines.forEach((l,i)=>txt(l,164,y+62+i*26,17,'#f4e4dc','left'));
  const done=S.radioChars>=r.text.length;
  txt(done?'[SPACE] '+(S.radioIdx<lv.info.radio.length-1?'continue':'begin'):'[SPACE] skip text',VW-48,y+h-12,11,'#ffb0a8','right','bold');
  txt('[ESC] skip transmission',48,y+h-12,10,'#a08088','left');
  // dots
  lv.info.radio.forEach((_,i)=>{ctx.fillStyle=i===S.radioIdx?'#ff6070':'#4a2a30';ctx.beginPath();ctx.arc(VW/2-14+i*14,y+h-16,3.5,0,7);ctx.fill();});
}
function dim(a){ctx.fillStyle='rgba(0,0,0,'+a+')';ctx.fillRect(0,0,VW,VH);}

/* ===================== RENDER ===================== */
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,VW,VH);ctx.globalAlpha=1;S.btns=[];
  const m=S.mode;
  if(m==='menu'||m==='controls'||m==='select'){
    drawBG(cam.x,0,((S.mt>>9)%20)+1);drawEmbers();dim(0.35);
    if(m==='menu'){drawTitle(150);drawList(menuItems(),230);
      txt('Stealth. Double-jump. Climb the tower.',VW/2,VH-30,13,'#c8a0a0','center','italic');}
    else if(m==='select')drawSelect();
    else{
      drawTitle(110);
      ctx.fillStyle='rgba(10,2,6,.82)';rr(150,170,660,320,12);ctx.fill();ctx.strokeStyle='#7a1a28';ctx.lineWidth=2;rr(150,170,660,320,12);ctx.stroke();
      const rows=[['A / D  or  Left / Right','Move'],['SPACE  (tap twice in air)','Jump / Double Jump'],['SHIFT','Sprint (uses stamina)'],['C  /  S  /  Down','Crouch - hide in tall grass & behind crates'],['E','Read clues, pull switches'],['ESC / P','Pause'],['M','Toggle audio'],['HAZARDS','Spikes hurt. Hounds chase - stomp them. Drones scan below.'],['GOAL','Stay out of flashlights. Fill the eye meter and you are caught.'],['BOSSES','Drop onto them from above for 12 damage.']];
      rows.forEach((r,i)=>{txt(r[0],190,205+i*28,14,'#ffd890','left','bold');txt(r[1],440,205+i*28,14,'#f4e4dc','left');});
      txt('[ENTER] back',VW/2,475,12,'#c8a0a0','center');
    }
    drawAudioBtn();return;
  }
  if(!lv){return;}
  const sh=S.shake,ox=(Math.random()-.5)*sh,oy=(Math.random()-.5)*sh;
  ctx.save();ctx.translate(ox,oy);
  drawBG(cam.x,cam.y,lv.n);
  ctx.save();ctx.translate(-Math.round(cam.x),-Math.round(cam.y));drawWorld();ctx.restore();
  drawEmbers();
  ctx.restore();
  drawHUD();
  if(m==='radio')drawRadio();
  if(m==='pause'){dim(0.6);txt('PAUSED',VW/2,150,48,'#f8e0d8','center','bold');drawList(menuItems(),180);}
  if(m==='over'){
    dim(0.72);const caught=S.overKind==='CAUGHT';
    ctx.save();ctx.shadowColor='#ff2030';ctx.shadowBlur=20;txt(caught?'CAUGHT':'DOWN',VW/2,230,72,'#ff5060','center','bold');ctx.restore();
    txt(caught?'The alarm echoes through the dark.':'The red sky swallows another night.',VW/2,275,18,'#e8c8c0','center','italic');
    txt('[ENTER] retry from last checkpoint      [ESC] main menu',VW/2,340,14,'#ffd890','center','bold');
  }
  if(m==='clear'){
    dim(0.7);txt('CHAPTER '+S.stats.n+' COMPLETE',VW/2,210,44,'#ffe9b0','center','bold');
    txt(LEVELS[S.stats.n-1].name,VW/2,246,20,'#f4d9cf','center','italic');
    txt('Clues found: '+S.stats.got+' / 2          Total: '+S.clues.size+' / 40',VW/2,296,16,'#ffd890','center');
    txt('Progress saved.   [ENTER] next chapter',VW/2,350,14,'#ffb0a8','center','bold');
  }
  if(m==='win'){
    dim(0.82);ctx.save();ctx.shadowColor='#ffd070';ctx.shadowBlur=24;txt('THE SKY TURNS',VW/2,190,58,'#ffe9b0','center','bold');ctx.restore();
    ['The Warden falls, and the tower groans into silence.','Above the old water tower the red drains from the clouds,','and a pale moon looks down on a panther who walked through everything unseen.'].forEach((l,i)=>txt(l,VW/2,250+i*28,17,'#f4e4dc','center','italic'));
    txt('Clues found: '+S.clues.size+' / 40',VW/2,350,16,'#ffd890','center');
    txt('[ENTER] main menu',VW/2,400,14,'#ffb0a8','center','bold');
  }
  drawAudioBtn();
}

/* ===================== MAIN LOOP ===================== */
let last=performance.now(),acc=0;const STEP=1000/60;
function frame(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=STEP){update();for(const k in pressed)delete pressed[k];acc-=STEP;}
  render();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__panther={cam,S,keys,pressed,update,render,startLevel,buildLevel,get lv(){return lv;},get P(){return P;},LEVELS,BOSS};
})();
</script>
